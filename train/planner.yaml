model: models/gemma-4-26B-A4B-it-MLX-4bit
train: true
data: train/planner
adapter_path: train/adapters/planner
fine_tune_type: lora
num_layers: 16
batch_size: 1
iters: 300
learning_rate: 1.0e-4
max_seq_length: 4096
grad_checkpoint: true
mask_prompt: true
steps_per_report: 10
steps_per_eval: 50
save_every: 100
seed: 0
lora_parameters:
  rank: 8
  scale: 20.0
  dropout: 0.0
  keys: ["self_attn.q_proj", "self_attn.k_proj", "self_attn.v_proj", "self_attn.o_proj", "mlp.gate_proj", "mlp.up_proj", "mlp.down_proj"]
